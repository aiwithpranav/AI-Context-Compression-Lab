name: CI

on:
  # Every branch push, so a problem shows up before the merge, not after it.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # No API keys in CI: the LLM layers are tested against fake OpenAI/Gemini servers.
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails only on high/critical advisories; known moderate ones are documented in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=high
